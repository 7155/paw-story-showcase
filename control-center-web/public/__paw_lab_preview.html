<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>PAW HTML Preview</title>
</head>
<body>
  <noscript>This preview requires JavaScript.</noscript>
  <script>
  (() => {
    const chunkSize = 0x8000;
    const maxChars = 16 * 1024 * 1024;
    const maxChunks = Math.ceil(maxChars / chunkSize);
    let transfer = null;

    const isParentMessage = (event) => event.source === window.parent;
    const validTransferId = (value) => typeof value === 'string'
      && value.length > 0 && value.length <= 128 && /^[A-Za-z0-9._:-]+$/.test(value);
    const post = (message) => window.parent.postMessage(message, '*');

    window.addEventListener('message', (event) => {
      if (!isParentMessage(event) || !event.data || typeof event.data !== 'object') return;
      const message = event.data;
      if (message.kind === 'paw.html-preview.start') {
        if (!validTransferId(message.transferId)
            || !Number.isSafeInteger(message.chunkCount)
            || message.chunkCount < 1 || message.chunkCount > maxChunks
            || !Number.isSafeInteger(message.sourceLength)
            || message.sourceLength < 1 || message.sourceLength > maxChars
            || message.chunkCount !== Math.ceil(message.sourceLength / chunkSize)) {
          transfer = null;
          return;
        }
        transfer = {
          id: message.transferId,
          chunkCount: message.chunkCount,
          sourceLength: message.sourceLength,
          chunks: new Array(message.chunkCount),
          received: 0,
          chars: 0,
        };
        return;
      }
      if (message.kind === 'paw.html-preview.chunk') {
        if (!transfer || message.transferId !== transfer.id
            || !Number.isSafeInteger(message.chunkIndex)
            || message.chunkIndex < 0 || message.chunkIndex >= transfer.chunkCount
            || typeof message.chunk !== 'string' || message.chunk.length > chunkSize
            || transfer.chunks[message.chunkIndex] !== undefined) return;
        transfer.chunks[message.chunkIndex] = message.chunk;
        transfer.received += 1;
        transfer.chars += message.chunk.length;
        if (transfer.chars > transfer.sourceLength || transfer.chars > maxChars) transfer = null;
        return;
      }
      if (message.kind !== 'paw.html-preview.end' || !transfer || message.transferId !== transfer.id
          || transfer.received !== transfer.chunkCount || transfer.chars !== transfer.sourceLength
          || transfer.chunks.some((chunk) => typeof chunk !== 'string')) return;
      const source = transfer.chunks.join('');
      const transferId = transfer.id;
      transfer = null;
      try {
        // document.open/write can remove this bootstrap's listeners. Every
        // source/version change therefore remounts a fresh bootstrap iframe.
        document.open();
        document.write(source);
        document.close();
        post({ kind: 'paw.html-preview.rendered', transferId });
      } catch (error) {
        document.body.textContent = `HTML preview failed: ${String(error)}`;
      }
    });
    post({ kind: 'paw.html-preview.ready' });
  })();
  </script>
</body>
</html>
