<!doctype html>
<html lang="zh-CN">
<head><script src="../assistant-snapshot.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松果售后助手</title>
<style>
:root{color-scheme:light;--ink:#17212b;--muted:#64748b;--line:#dbe4ee;--brand:#0f766e;--brand2:#115e59;--soft:#f0fdfa;--warn:#fff7ed;--danger:#fff1f2}*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1040px;margin:0 auto;padding:36px 20px 56px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:var(--brand);font-weight:700;letter-spacing:.06em;font-size:12px}.hero h1{font-size:32px;line-height:1.2;margin:6px 0}.hero p{margin:8px 0;color:var(--muted);max-width:700px}.hero .details{margin-top:12px;font-size:13px}.badge{border:1px solid #99f6e4;border-radius:999px;padding:5px 10px;color:var(--brand2);background:var(--soft);white-space:nowrap;font-size:12px}.panel,.card{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 20px #17212b0b}.panel{padding:20px}.panel label{font-weight:700;display:block;margin-bottom:9px}.hint{color:var(--muted);font-size:13px;margin:0 0 10px}textarea{display:block;width:100%;min-height:145px;resize:vertical;border:1px solid #b9c7d6;border-radius:11px;padding:13px;font:inherit;color:inherit}textarea:focus{outline:3px solid #99f6e455;border-color:var(--brand)}.toolbar{display:flex;align-items:center;gap:12px;margin-top:13px;min-width:0}.button{border:0;border-radius:10px;background:var(--brand);color:white;font-weight:700;padding:10px 17px;cursor:pointer;flex:0 0 auto;white-space:nowrap}.button:hover{background:var(--brand2)}.button:disabled{opacity:.55;cursor:wait}.status{color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}.status.error{color:#b91c1c}.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.history-button{margin-top:15px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--brand2);padding:9px 12px;cursor:pointer}.history{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.history-list{display:grid;gap:8px}.history-item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;background:#f8fafc;padding:10px;text-align:left;min-width:0}.history-item>div{min-width:0;overflow-wrap:anywhere}.history-item strong{display:block;font-size:13px}.history-item small{color:var(--muted)}.history-item button{border:0;background:transparent;color:var(--brand2);font-weight:700;cursor:pointer;flex:0 0 auto;white-space:nowrap}.example{background:#f8fafc;border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer;color:#334155;font-size:13px}.example:hover{border-color:#5eead4;background:var(--soft)}#result{margin-top:22px}.result-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.result-head h2{margin:0;font-size:20px}.pill{font-size:12px;background:#ecfdf5;color:#166534;padding:4px 9px;border-radius:999px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:15px}.card{padding:16px}.card h3{font-size:14px;margin:0 0 7px;color:#334155}.card p,.card ul{margin:0;white-space:pre-wrap}.card ul{padding-left:20px}.card.full{grid-column:1/-1}.safety{background:var(--danger);border-color:#fecdd3}.safety h3{color:#9f1239}.usage-details{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:10px 13px}.usage-details summary{cursor:pointer;color:var(--brand2);font-weight:700}.usage-details .usage-content{margin-top:10px;color:var(--muted);white-space:pre-wrap}.empty{color:var(--muted);padding:24px 0;text-align:center}@media(max-width:680px){main{padding:24px 14px}.hero{display:block}.badge{display:inline-block;margin-top:12px}.grid{grid-template-columns:1fr}.card.full{grid-column:auto}}
</style>
</head>
<body>
<main>
<section class="hero"><div><div class="eyebrow">售后咨询</div><h1>松果售后助手</h1><p>描述你的问题，我们会根据松果设备售后工作规则整理处理建议、依据、待补充事实和下一步。</p><p class="details">仅提供规则建议，不执行退款、发货或创建工单。回答结果请结合订单事实核对。</p></div><span class="badge">依据规则 v1</span></section>
<section class="panel" aria-labelledby="ask-title"><label id="ask-title" for="question">描述你的售后问题</label><p class="hint">请不要提供密码、验证码或完整银行卡号。可直接描述商品、日期、故障与凭证情况。</p><textarea id="question" maxlength="5000" placeholder="例如：我的标准耳机签收第 7 天，未拆封且配件齐全，想退货。"></textarea><div class="toolbar"><button class="button" id="submit" type="button">提交咨询</button><span class="status" id="status" role="status" aria-live="polite"></span></div><div class="examples" aria-label="示例问题"><button class="example" type="button">签收第30天耳机出现故障</button><button class="example" type="button">想知道退款多久到账</button></div><button class="history-button" id="history-toggle" type="button" aria-expanded="false" aria-controls="history">查看最近咨询 / 恢复结果</button><div id="history" class="history" hidden><p class="history-empty">正在读取最近咨询…</p></div></section>
<section id="result" aria-live="polite"><div class="empty">提交问题后，这里会显示结构化处理建议。</div></section>
</main>
<script>
const $=id=>document.getElementById(id);const q=$('question');const submit=$('submit');const status=$('status');const result=$('result');const historyToggle=$('history-toggle');const historyBox=$('history');
const draftKey='songguo-support-draft';
function safeStorage(method,key,value){try{if(!window.sessionStorage)return null;if(method==='get')return window.sessionStorage.getItem(key);window.sessionStorage.setItem(key,value);return true}catch{return null}}
const savedDraft=safeStorage('get',draftKey);if(savedDraft)q.value=savedDraft;q.addEventListener('input',()=>safeStorage('set',draftKey,q.value));
function time(ms){if(!ms)return '时间未知';try{return new Date(ms).toLocaleString('zh-CN',{hour12:false})}catch{return '时间未知'}}
function stateText(state){return ({completed:'已完成',running:'处理中',queued:'处理中',pending:'处理中',failed:'未完成',error:'未完成',rejected:'未完成',cancelled:'未完成'})[state]||'结果未确认'}
function historyText(item){return item&&item.input&&item.input.question?item.input.question:'未确认原请求'}
function setBusy(busy){q.disabled=busy;submit.disabled=busy;historyToggle.disabled=busy;document.querySelectorAll('.example,[data-history-index]').forEach(control=>control.disabled=busy)}
function questionBlock(question){return '<article class="card full"><h3>对应的原问题</h3><p>'+esc(question||'未确认原请求')+'</p></article>'}
function showHistory(items){if(!Array.isArray(items)||!items.length){historyBox.innerHTML='<p class="history-empty">暂无可恢复的咨询记录。</p>';return}historyBox.innerHTML='<div class="history-list">'+items.slice(0,20).map((item,index)=>'<div class="history-item"><div><strong>'+esc(historyText(item).slice(0,80))+'</strong><small>'+esc(time(item.createdAtMs))+' · '+esc(stateText(item.state))+'</small></div><button type="button" data-history-index="'+index+'">恢复结果</button></div>').join('')+'</div>';historyBox.querySelectorAll('[data-history-index]').forEach(button=>button.addEventListener('click',()=>restoreHistory(items[Number(button.dataset.historyIndex)])))}
async function loadHistory(){if(typeof window.pawApp.history!=='function'){historyBox.innerHTML='<p class="history-empty">当前运行器不提供历史读取；可继续使用当前咨询。</p>';return}try{showHistory(await window.pawApp.history())}catch(error){historyBox.innerHTML='<p class="history-empty">最近咨询暂时无法读取： '+esc(error&&error.message?error.message:String(error))+'</p>'}}
function restoreHistory(item){if(submit.disabled)return;const question=historyText(item);q.value=question;safeStorage('set',draftKey,q.value);status.className='status';status.textContent='已恢复原请求；历史结果不会再次提交。';if(item&&item.state==='completed'&&item.result){render(item.result,true,item.createdAtMs,question)}else{result.innerHTML='<div class="result-head"><h2>历史结果未确认</h2><span class="pill">'+esc(time(item&&item.createdAtMs))+'</span></div>'+questionBlock(question)+'<div class="card"><h3>请核对原请求</h3><p>这条咨询尚未得到可恢复的完成结果。请核对原请求后，再决定是否重新提交。</p><p>运行状态：'+esc(item&&item.message?item.message:stateText(item&&item.state))+'</p><p>你也可以查看最近咨询记录。</p></div>'}}
historyToggle.addEventListener('click',()=>{const open=!historyBox.hidden;historyBox.hidden=open;historyToggle.setAttribute('aria-expanded',String(!open));if(!open)loadHistory()});
for(const b of document.querySelectorAll('.example')) b.addEventListener('click',()=>{if(submit.disabled)return;q.value=b.textContent;safeStorage('set',draftKey,q.value);q.focus()});
const labels={rule:'规则',rules:'规则',facts:'相关事实',fact:'相关事实',reason:'判断依据',detail:'说明',details:'说明',condition:'适用条件',conditions:'适用条件',status:'状态',source:'来源',value:'内容'};
function clean(v){return v==null||v===''?'当前无需补充':v}
function text(v){if(v==null||v==='')return '当前无需补充';if(Array.isArray(v))return v.map(text).join('；');if(typeof v==='object')return Object.entries(v).map(([k,val])=>(labels[k]||'相关信息')+'：'+text(val)).join('；');return String(v)}
function list(v,empty='当前无需补充'){if(v==null||v===''||(Array.isArray(v)&&v.length===0))return '<p>'+empty+'</p>';if(Array.isArray(v))return '<ul>'+v.map(x=>'<li>'+esc(text(x))+'</li>').join('')+'</ul>';return '<p>'+esc(text(v))+'</p>'}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function hasValue(v){return Array.isArray(v)?v.length>0:v!=null&&v!==''}
function render(data,historical=false,createdAtMs,originalQuestion='未确认原请求'){let raw=data&&data.text?data.text:data;let parsed=raw;try{if(typeof raw==='string')parsed=JSON.parse(raw)}catch{}if(!parsed||typeof parsed!=='object'){result.innerHTML='<div class="result-head"><h2>'+(historical?'历史结果':'本次咨询建议')+'</h2><span class="pill">'+(historical?esc(time(createdAtMs)):'规则证据待核对')+'</span></div>'+questionBlock(originalQuestion)+'<div class="card"><h3>'+(historical?'历史结果':'处理建议')+'</h3><p>'+esc(text(raw))+'</p></div>';return}const safety=parsed.safety_privacy_flags||parsed.safetyPrivacyFlags;const human=parsed.unsupported_claims||parsed.unsupportedClaims;const safetyBlock=hasValue(safety)?'<details class="usage-details"><summary>使用提醒</summary><div class="usage-content">'+esc(text(safety))+'</div></details>':'';result.innerHTML='<div class="result-head"><h2>'+(historical?'历史结果':'本次咨询建议')+'</h2><span class="pill">'+(historical?esc(time(createdAtMs)):'规则证据待核对')+'</span></div>'+questionBlock(originalQuestion)+'<div class="grid"><article class="card"><h3>处理建议</h3>'+list(parsed.decision||parsed.advice)+'</article><article class="card"><h3>规则证据与事实</h3>'+list(parsed.evidence)+'</article><article class="card"><h3>下一步</h3>'+list(parsed.next_step||parsed.nextStep)+'</article><article class="card"><h3>待补充事实</h3>'+list(parsed.missing_fields||parsed.missingFields)+'</article><article class="card full"><h3>需要人工确认</h3>'+list(human,'当前没有需要额外人工确认的事项')+'</article></div>'+safetyBlock}
async function ask(){if(submit.disabled)return;const value=q.value.trim();if(!value){status.textContent='请先描述问题。';status.className='status error';q.focus();return}setBusy(true);status.className='status';status.textContent='正在核对规则并生成建议…';result.innerHTML=questionBlock(value)+'<div class="card"><p>处理中，请稍候。</p></div>';try{const response=await window.pawApp.invoke('consult',{question:value});render(response,false,undefined,value);status.textContent='已生成建议，请核对规则证据与待补充事实。'}catch(error){const message=error&&error.message?error.message:'未知运行错误';const state=error&&error.state;const stopped=['failed','rejected','cancelled'].includes(state);const heading=stopped?'咨询未完成或已停止':'结果尚未确认';const guidance=stopped?'请查看最近咨询记录，确认运行状态后再决定下一步。':'请查看最近咨询记录或核对原请求；当前不将这次咨询判定为失败。';result.innerHTML='<div class="result-head"><h2>'+heading+'</h2><span class="pill">'+(state?esc(stateText(state)):'结果未确认')+'</span></div>'+questionBlock(value)+'<div class="card '+(stopped?'safety':'')+'"><h3>'+heading+'</h3><p>'+guidance+'</p><p>运行器错误：'+esc(message)+'</p></div>';status.textContent=stopped?'咨询未完成，可查看最近咨询。':'结果尚未确认，请查看最近咨询或核对原请求。';status.className='status '+(stopped?'error':'')}finally{setBusy(false)}}
submit.addEventListener('click',ask);q.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')ask()});
</script>
</body></html>
<script src="../replay-guide.js"></script>
