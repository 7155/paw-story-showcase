<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">AIOS-IME：一次按键，到三条候选</title><desc id="desc">Local single user · one Prefill · complete Top-3</desc><metadata>PAW public source-grounded redraw, 2026-09-05. Renderer: scripts/render-story-diagrams.mjs. Existing diagram facts retained; no new measurements.</metadata><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:34px;font-weight:600;fill:#22272d}.sub{font-size:18px;fill:#5d6570}.body{font-size:21px;fill:#22272d}.label{font-size:16px;fill:#5d6570}.accent{font-size:19px;fill:#5447a0;font-weight:600}.small{font-size:15px;fill:#5d6570}</style><rect width="1200" height="670" fill="#fafaf7"/><text x="48" y="64" class="title">AIOS-IME：一次按键，到三条候选</text><text x="48" y="102" class="sub">Local single user · one Prefill · complete Top-3</text><path d="M48 128 H1152" stroke="#dddeda"/><rect x="48" y="154" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="202" class="accent">01</text><text x="124" y="188" class="body">Chinese prefix → Tokenizer</text><text x="124" y="217" class="label">对当前中文前缀重新分词，计算 token-LCP。</text><rect x="48" y="244" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="292" class="accent">02</text><text x="124" y="278" class="body">Prefix Prefill</text><text x="124" y="307" class="label">稳定 token 前缀复用 KV，新尾部只执行一次 Prefill。</text><rect x="48" y="334" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="382" class="accent">03</text><text x="124" y="368" class="body">Candidate Group</text><text x="124" y="397" class="label">8 条独立候选共享前缀，按仍活跃的 decode rows 推进。</text><rect x="48" y="424" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="472" class="accent">04</text><text x="124" y="458" class="body">Filter / Dedup / MMR</text><text x="124" y="487" class="label">保留 raw LM score，过滤、去重并选择不同的候选。</text><rect x="48" y="514" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="562" class="accent">05</text><text x="124" y="548" class="body">Top-3 → Candidate Bar</text><text x="124" y="577" class="label">显示完整三条中文后缀，等待用户选择或下一次按键。</text><text x="48" y="630" class="small">主路径直接生成中文后缀，不要求经过拼音词典召回。</text></svg>
