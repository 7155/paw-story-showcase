<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">Prefix KV：按 token 复用，按新输入接管</title><desc id="desc">重新分词 → 找到稳定前缀 → 重算变化尾部。</desc><metadata>PAW public source-grounded redraw, 2026-09-05. Renderer: scripts/render-story-diagrams.mjs. Existing diagram facts retained; no new measurements.</metadata><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:34px;font-weight:600;fill:#22272d}.sub{font-size:18px;fill:#5d6570}.body{font-size:21px;fill:#22272d}.label{font-size:16px;fill:#5d6570}.accent{font-size:19px;fill:#5447a0;font-weight:600}.small{font-size:15px;fill:#5d6570}</style><rect width="1200" height="670" fill="#fafaf7"/><text x="48" y="64" class="title">Prefix KV：按 token 复用，按新输入接管</text><text x="48" y="102" class="sub">重新分词 → 找到稳定前缀 → 重算变化尾部。</text><path d="M48 128 H1152" stroke="#dddeda"/><rect x="48" y="154" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="202" class="accent">01</text><text x="124" y="188" class="body">上一次按键</text><text x="124" y="217" class="label">没关系，你先忙你 · 3497 243 192 144 297 518 3035 297</text><rect x="48" y="244" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="292" class="accent">02</text><text x="124" y="278" class="body">当前按键</text><text x="124" y="307" class="label">没关系，你先忙你的， · 3497 243 192 144 297 518 3559 243 192 144</text><rect x="48" y="334" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="382" class="accent">03</text><text x="124" y="368" class="body">token-LCP = 6</text><text x="124" y="397" class="label">只复用前 6 个稳定 token；字符前缀长度不能代替 token-LCP。</text><rect x="48" y="424" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="472" class="accent">04</text><text x="124" y="458" class="body">重算发生重切的尾部</text><text x="124" y="487" class="label">3035 + 297 → 3559 + …；避免复用不对应的旧 KV。</text><rect x="48" y="514" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="562" class="accent">05</text><text x="124" y="548" class="body">latest-wins</text><text x="124" y="577" class="label">旧候选组在 token-step 边界失效，丢弃旧输出并释放缓存。</text><text x="48" y="630" class="small">只有当前 generation 的候选组可以继续显示。</text></svg>
