<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc"><title id="title">一个任务，怎样成为下一次工作的起点？</title><desc id="desc">PAW 展示主线：目标、交付、验证、改进与继续。</desc><metadata>PAW public source-grounded redraw, 2026-09-05. Renderer: scripts/render-story-diagrams.mjs. Existing diagram facts retained; no new measurements.</metadata><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:34px;font-weight:600;fill:#22272d}.sub{font-size:18px;fill:#5d6570}.body{font-size:21px;fill:#22272d}.label{font-size:16px;fill:#5d6570}.accent{font-size:19px;fill:#5447a0;font-weight:600}.small{font-size:15px;fill:#5d6570}</style><rect width="1200" height="670" fill="#fafaf7"/><text x="48" y="64" class="title">一个任务，怎样成为下一次工作的起点？</text><text x="48" y="102" class="sub">PAW 展示主线：目标、交付、验证、改进与继续。</text><path d="M48 128 H1152" stroke="#dddeda"/><rect x="48" y="154" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="202" class="accent">01</text><text x="124" y="188" class="body">提出任务</text><text x="124" y="217" class="label">先说明用户要什么，以及什么结果才算有用。</text><rect x="48" y="244" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="292" class="accent">02</text><text x="124" y="278" class="body">协作交付</text><text x="124" y="307" class="label">独立责任并行推进，依赖通过交接解决，最后汇总。</text><rect x="48" y="334" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="382" class="accent">03</text><text x="124" y="368" class="body">评测问题</text><text x="124" y="397" class="label">原始要求对照实际行为、测试与 Trace，定位具体缺口。</text><rect x="48" y="424" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="472" class="accent">04</text><text x="124" y="458" class="body">验证并保留改进</text><text x="124" y="487" class="label">比较候选、检查其他样本；有效时保留，退步时拒绝。</text><rect x="48" y="514" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="562" class="accent">05</text><text x="124" y="548" class="body">下一次继续工作</text><text x="124" y="577" class="label">已采用的策略与按需召回的上下文支持后续任务。</text><text x="48" y="630" class="small">每个案例分别标明合成回放、实验结果和适用范围。</text></svg>
