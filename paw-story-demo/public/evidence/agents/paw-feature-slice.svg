<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">从一个需求，到一份可以检查的交付</title><desc id="desc">按可观察结果连接各层责任。</desc><metadata>PAW public source-grounded redraw, 2026-09-05. Renderer: scripts/render-story-diagrams.mjs. Existing diagram facts retained; no new measurements.</metadata><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:34px;font-weight:600;fill:#22272d}.sub{font-size:18px;fill:#5d6570}.body{font-size:21px;fill:#22272d}.label{font-size:16px;fill:#5d6570}.accent{font-size:19px;fill:#5447a0;font-weight:600}.small{font-size:15px;fill:#5d6570}</style><rect width="1200" height="760" fill="#fafaf7"/><text x="48" y="64" class="title">从一个需求，到一份可以检查的交付</text><text x="48" y="102" class="sub">按可观察结果连接各层责任。</text><path d="M48 128 H1152" stroke="#dddeda"/><rect x="48" y="154" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="202" class="accent">01</text><text x="124" y="188" class="body">用户 → PAWOS</text><text x="124" y="217" class="label">提出目标和可观察验收；界面提交 typed intent。</text><rect x="48" y="244" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="292" class="accent">02</text><text x="124" y="278" class="body">Room → Pi Session</text><text x="124" y="307" class="label">按需要分派工作；Session 计划并执行最小纵向闭环。</text><rect x="48" y="334" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="382" class="accent">03</text><text x="124" y="368" class="body">Pi Session → Tool Gateway</text><text x="124" y="397" class="label">在已授予范围内执行工具，返回结果与回执。</text><rect x="48" y="424" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="472" class="accent">04</text><text x="124" y="458" class="body">AgentResult → Facilitator</text><text x="124" y="487" class="label">整合各项结果、依赖与未完成项，形成一个终态。</text><rect x="48" y="514" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="562" class="accent">05</text><text x="124" y="548" class="body">Trace / Eval → 改进决策</text><text x="124" y="577" class="label">固定案例检查结果；Keep / Reject / Promote 标明范围。</text><rect x="48" y="604" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="652" class="accent">06</text><text x="124" y="638" class="body">Runtime 事件 → PAWOS</text><text x="124" y="667" class="label">投影同一份运行状态；失败返回具体责任方继续处理。</text><text x="48" y="720" class="small">图中箭头表示信息与结果的传递，不代表每步新增一次审批。</text></svg>
