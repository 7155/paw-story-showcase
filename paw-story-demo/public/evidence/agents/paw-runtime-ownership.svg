<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">PAW：谁负责执行，谁负责协作？</title><desc id="desc">运行责任分开，用户看到同一条工作链。</desc><metadata>PAW public source-grounded redraw, 2026-09-05. Renderer: scripts/render-story-diagrams.mjs. Existing diagram facts retained; no new measurements.</metadata><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:34px;font-weight:600;fill:#22272d}.sub{font-size:18px;fill:#5d6570}.body{font-size:21px;fill:#22272d}.label{font-size:16px;fill:#5d6570}.accent{font-size:19px;fill:#5447a0;font-weight:600}.small{font-size:15px;fill:#5d6570}</style><rect width="1200" height="760" fill="#fafaf7"/><text x="48" y="64" class="title">PAW：谁负责执行，谁负责协作？</text><text x="48" y="102" class="sub">运行责任分开，用户看到同一条工作链。</text><path d="M48 128 H1152" stroke="#dddeda"/><rect x="48" y="154" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="202" class="accent">01</text><text x="124" y="188" class="body">用户 Goal 与控制</text><text x="124" y="217" class="label">提出目标、补充要求，并控制继续与停止。</text><rect x="48" y="244" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="292" class="accent">02</text><text x="124" y="278" class="body">Pi Session</text><text x="124" y="307" class="label">Transcript、Agent / Tool loop、上下文、Steer / Stop 与恢复。</text><rect x="48" y="334" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="382" class="accent">03</text><text x="124" y="368" class="body">Room</text><text x="124" y="397" class="label">围绕 Session 增加身份、显式派发、公共顺序与一个汇总结果。</text><rect x="48" y="424" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="472" class="accent">04</text><text x="124" y="458" class="body">Tool Gateway</text><text x="124" y="487" class="label">接收策略内工具调用，检查合同与权限，返回执行回执。</text><rect x="48" y="514" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="562" class="accent">05</text><text x="124" y="548" class="body">Memory / Knowledge</text><text x="124" y="577" class="label">按当前任务检索获准的有界上下文，保留各自来源。</text><rect x="48" y="604" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="652" class="accent">06</text><text x="124" y="638" class="body">Trace / Eval 与 PAWOS</text><text x="124" y="667" class="label">Trace 记录执行，Eval 对照案例；界面投影同一份运行状态。</text><text x="48" y="720" class="small">Session 执行 → 结果与事件 → 状态投影；Room 不创建第二套 Agent loop。</text></svg>
