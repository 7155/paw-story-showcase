<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">MiniMind-IME：数据怎样变成输入候选</title><desc id="desc">每阶段保留数据合同、泄漏检查与可重放报告。</desc><metadata>PAW public source-grounded redraw, 2026-09-05. Renderer: scripts/render-story-diagrams.mjs. Existing diagram facts retained; no new measurements.</metadata><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}.title{font-size:34px;font-weight:600;fill:#22272d}.sub{font-size:18px;fill:#5d6570}.body{font-size:21px;fill:#22272d}.label{font-size:16px;fill:#5d6570}.accent{font-size:19px;fill:#5447a0;font-weight:600}.small{font-size:15px;fill:#5d6570}</style><rect width="1200" height="760" fill="#fafaf7"/><text x="48" y="64" class="title">MiniMind-IME：数据怎样变成输入候选</text><text x="48" y="102" class="sub">每阶段保留数据合同、泄漏检查与可重放报告。</text><path d="M48 128 H1152" stroke="#dddeda"/><rect x="48" y="154" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="202" class="accent">01</text><text x="124" y="188" class="body">原始语料 → 清洗</text><text x="124" y="217" class="label">MiniMind / Wiki / blog / 用户提供文本；HTML/code/style 过滤与 SHA / MinHash 去重。</text><rect x="48" y="244" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="292" class="accent">02</text><text x="124" y="278" class="body">Tokenizer → NTP</text><text x="124" y="307" class="label">IME-weighted 16K；最终 0.1B 分支继续预训练，546M → 646M tokens。</text><rect x="48" y="334" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="382" class="accent">03</text><text x="124" y="368" class="body">Completion SFT</text><text x="124" y="397" class="label">prefix labels = -100；9 stages、99,990 rows。</text><rect x="48" y="424" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="472" class="accent">04</text><text x="124" y="458" class="body">教师与偏好实验</text><text x="124" y="487" class="label">50,894 教师样本；450 listwise groups 隔离 13 后保留 437；682 → 317 pairs。</text><rect x="48" y="514" width="1104" height="82" rx="3" fill="#efefec"/><text x="68" y="562" class="accent">05</text><text x="124" y="548" class="body">冻结评测 → 拒绝不稳候选</text><text x="124" y="577" class="label">15 generation、145 context、40 same-pinyin；train_eligible = false。</text><rect x="48" y="604" width="1104" height="82" rx="3" fill="#fafaf7"/><text x="68" y="652" class="accent">06</text><text x="124" y="638" class="body">独立候选池 → Top-3</text><text x="124" y="667" class="label">8 sampled attempts，过滤、去重、打分；记录接受与拒绝反馈。</text><text x="48" y="720" class="small">20% teacher + 80% replay probe 未过 held-out/stability；reranker probe 未提升到线上。</text></svg>
