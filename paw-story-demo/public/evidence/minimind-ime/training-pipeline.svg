<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="650" viewBox="0 0 1800 650"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#475569" flood-opacity="0.20"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4b5563"/></marker></defs><rect width="1800" height="650" fill="#fbfcfe"/><text x="900" y="48" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="31" font-weight="700" fill="#172033">Data → Training → Preference → IME Top-3</text><text x="900" y="76" text-anchor="middle" font-family="Inter,Arial" font-size="15" fill="#667085">every arrow has a dataset contract, leakage gate and reproducible report</text><g filter="url(#shadow)"><rect x="45" y="130" width="250" height="125" rx="18" fill="#e4edf9" stroke="#cad1da"/></g><text x="170.0" y="164" text-anchor="middle" font-size="20" font-weight="700" fill="#10151d">Raw corpora</text><text x="170.0" y="191" text-anchor="middle" font-size="14" fill="#48515d">MiniMind · Wiki · blog</text><text x="170.0" y="213" text-anchor="middle" font-size="14" fill="#48515d">user-provided natural text</text><g filter="url(#shadow)"><rect x="345" y="130" width="250" height="125" rx="18" fill="#f7e4b5" stroke="#cad1da"/></g><text x="470.0" y="164" text-anchor="middle" font-size="20" font-weight="700" fill="#10151d">Audit &amp; cleaning</text><text x="470.0" y="191" text-anchor="middle" font-size="14" fill="#48515d">HTML/code/style filters</text><text x="470.0" y="213" text-anchor="middle" font-size="14" fill="#48515d">SHA + MinHash dedup</text><g filter="url(#shadow)"><rect x="645" y="130" width="250" height="125" rx="18" fill="#dcebcf" stroke="#cad1da"/></g><text x="770.0" y="164" text-anchor="middle" font-size="20" font-weight="700" fill="#10151d">Tokenizer + NTP</text><text x="770.0" y="191" text-anchor="middle" font-size="14" fill="#48515d">IME-weighted 16K</text><text x="770.0" y="213" text-anchor="middle" font-size="14" fill="#48515d">546M → 646M tokens</text><g filter="url(#shadow)"><rect x="945" y="130" width="250" height="125" rx="18" fill="#eadcf5" stroke="#cad1da"/></g><text x="1070.0" y="164" text-anchor="middle" font-size="20" font-weight="700" fill="#10151d">Completion SFT</text><text x="1070.0" y="191" text-anchor="middle" font-size="14" fill="#48515d">prefix labels = -100</text><text x="1070.0" y="213" text-anchor="middle" font-size="14" fill="#48515d">9 stages · 99,990 rows</text><g filter="url(#shadow)"><rect x="1245" y="130" width="250" height="125" rx="18" fill="#cfe5f3" stroke="#cad1da"/></g><text x="1370.0" y="164" text-anchor="middle" font-size="20" font-weight="700" fill="#10151d">Independent pool</text><text x="1370.0" y="191" text-anchor="middle" font-size="14" fill="#48515d">8 sampled attempts</text><text x="1370.0" y="213" text-anchor="middle" font-size="14" fill="#48515d">filter + dedup + score</text><g filter="url(#shadow)"><rect x="1545" y="130" width="210" height="125" rx="18" fill="#f4c7b5" stroke="#cad1da"/></g><text x="1650.0" y="164" text-anchor="middle" font-size="20" font-weight="700" fill="#10151d">Top-3</text><text x="1650.0" y="191" text-anchor="middle" font-size="14" fill="#48515d">candidate bar</text><text x="1650.0" y="213" text-anchor="middle" font-size="14" fill="#48515d">accept/reject feedback</text><path d="M295,192 L345,192" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><path d="M595,192 L645,192" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><path d="M895,192 L945,192" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><path d="M1195,192 L1245,192" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><path d="M1495,192 L1545,192" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="420" y="360" width="300" height="135" rx="18" fill="#dce9f7" stroke="#cad1da"/></g><text x="570.0" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#10151d">GPT-5.5 Pro teacher</text><text x="570.0" y="421" text-anchor="middle" font-size="14" fill="#48515d">50,894 prefix→completion</text><text x="570.0" y="443" text-anchor="middle" font-size="14" fill="#48515d">sequence-level hard labels</text><text x="570.0" y="465" text-anchor="middle" font-size="14" fill="#48515d">20% teacher + 80% replay probe</text><g filter="url(#shadow)"><rect x="810" y="360" width="300" height="135" rx="18" fill="#e2d8f4" stroke="#cad1da"/></g><text x="960.0" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#10151d">GPT-5.6 preference</text><text x="960.0" y="421" text-anchor="middle" font-size="14" fill="#48515d">450 groups → quarantine 13</text><text x="960.0" y="443" text-anchor="middle" font-size="14" fill="#48515d">437 listwise groups</text><text x="960.0" y="465" text-anchor="middle" font-size="14" fill="#48515d">hard mining: 682 → 317 pairs</text><g filter="url(#shadow)"><rect x="1200" y="360" width="300" height="135" rx="18" fill="#d9ecd9" stroke="#cad1da"/></g><text x="1350.0" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#10151d">Frozen eval v2</text><text x="1350.0" y="421" text-anchor="middle" font-size="14" fill="#48515d">15 generation · 145 context</text><text x="1350.0" y="443" text-anchor="middle" font-size="14" fill="#48515d">40 same-pinyin groups</text><text x="1350.0" y="465" text-anchor="middle" font-size="14" fill="#48515d">train_eligible = false</text><path d="M720,426 L945,255" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M1110,426 L1320,255" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><path d="M1350,360 L1350,255" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 7"/><text x="570" y="526" text-anchor="middle" font-family="Inter,Arial" font-size="14" fill="#b24a4a">probe rejected: held-out/stability gate</text><text x="960" y="526" text-anchor="middle" font-family="Inter,Arial" font-size="14" fill="#b24a4a">reranker probe not promoted online</text><rect x="80" y="555" width="1640" height="58" rx="16" fill="#f1f5f9" stroke="#d6dde6"/><text x="110" y="580" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#334155">Example contracts</text><text x="110" y="601" font-family="Inter,Arial" font-size="14" fill="#586273">NTP: “窗台最近落了不少灰…” → predict every next token　　SFT: prefix “窗台最近落了不少” → completion “灰，先把东西移开再擦一遍。”　　Listwise: sensible > acceptable > hard/off-topic</text></svg>
