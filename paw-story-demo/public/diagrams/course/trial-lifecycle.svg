<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title desc"><title id="title">一个 Trial，从接受到收口</title><desc id="desc">重放请求返回旧任务；恢复记录不自动恢复付费执行。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#77788c"/></marker></defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#202532}.node{font-size:18px;font-weight:600}.caption{font-size:13px;fill:#586375}.edge{font-size:14px;fill:#5143ae}</style><rect width="1080" height="810" fill="#f7f8fa"/><text x="55" y="65" font-size="30" font-weight="600">一个 Trial，从接受到收口</text><text x="55" y="110" font-size="17">重放请求返回旧任务；恢复记录不自动恢复付费执行。</text><path d="M285,217.0 L425,217.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="334.0" y="199.0" width="42" height="25" fill="#f7f8fa"/><text x="355.0" y="217.0" text-anchor="middle" class="edge">新身份</text><path d="M655,217.0 L795,217.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="697.0" y="199.0" width="56" height="25" fill="#f7f8fa"/><text x="725.0" y="217.0" text-anchor="middle" class="edge">事务领取</text><path d="M910.0,264 L910.0,405" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="861.0" y="316.5" width="98" height="25" fill="#f7f8fa"/><text x="910.0" y="334.5" text-anchor="middle" class="edge">正常返回或失败</text><path d="M910.0,264 L540.0,405" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="697.0" y="316.5" width="56" height="25" fill="#f7f8fa"/><text x="725.0" y="334.5" text-anchor="middle" class="edge">请求停止</text><path d="M540.0,264 L170.0,405" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="257.0" y="316.5" width="196" height="25" fill="#f7f8fa"/><text x="355.0" y="334.5" text-anchor="middle" class="edge">替换 Application</text><path d="M170.0,264 L170.0,310 L1050,310 L1050,687.0 L285,687.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="582.0" y="286" width="56" height="25" fill="#f7f8fa"/><text x="610.0" y="304" text-anchor="middle" class="edge">指纹不同</text><rect x="55" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="71" y="204" class="node">admit</text><text x="71" y="230" class="caption">请求 ID + 配置指纹</text><rect x="425" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="441" y="204" class="node">queued</text><text x="441" y="230" class="caption">已持久接受</text><rect x="795" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="811" y="204" class="node">running</text><text x="811" y="230" class="caption">claim 后才执行 adapter</text><rect x="795" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="811" y="439" class="node">completed / failed</text><text x="811" y="465" class="caption">实际执行与清理收口</text><rect x="425" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="441" y="439" class="node">cancelling → cancelled</text><text x="441" y="465" class="caption">停止请求 / abort / 清理</text><rect x="55" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="71" y="439" class="node">interrupted</text><text x="71" y="465" class="caption">旧 owner 停止后的中断记录</text><rect x="55" y="640" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="71" y="674" class="node">409 request_id_conflict</text><text x="71" y="700" class="caption">同 ID 却换了配置</text><text x="55" y="786" font-size="13" fill="#586375">PAW · 2026-09-05 源码教学图；不是实时运行或收益图</text></svg>