<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title desc"><title id="title">Room 怎样关联一个 Session 回合</title><desc id="desc">只有明确派发的回合才归入这次公共协作。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#77788c"/></marker></defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#202532}.node{font-size:18px;font-weight:600}.caption{font-size:13px;fill:#586375}.edge{font-size:14px;fill:#5143ae}</style><rect width="1080" height="810" fill="#f7f8fa"/><text x="55" y="65" font-size="30" font-weight="600">Room 怎样关联一个 Session 回合</text><text x="55" y="110" font-size="17">只有明确派发的回合才归入这次公共协作。</text><path d="M285,217.0 L425,217.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="327.0" y="199.0" width="56" height="25" fill="#f7f8fa"/><text x="355.0" y="217.0" text-anchor="middle" class="edge">显式派发</text><path d="M655,217.0 L795,217.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="697.0" y="199.0" width="56" height="25" fill="#f7f8fa"/><text x="725.0" y="217.0" text-anchor="middle" class="edge">请求执行</text><path d="M910.0,264 L910.0,405" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="882.0" y="316.5" width="56" height="25" fill="#f7f8fa"/><text x="910.0" y="334.5" text-anchor="middle" class="edge">先到事件</text><path d="M910.0,264 L540.0,405" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="683.0" y="316.5" width="84" height="25" fill="#f7f8fa"/><text x="725.0" y="334.5" text-anchor="middle" class="edge">接受 ACK</text><path d="M795,452.0 L655,452.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="690.0" y="434.0" width="70" height="25" fill="#f7f8fa"/><text x="725.0" y="452.0" text-anchor="middle" class="edge">匹配后释放</text><path d="M425,452.0 L285,452.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="313.0" y="434.0" width="84" height="25" fill="#f7f8fa"/><text x="355.0" y="452.0" text-anchor="middle" class="edge">附加协作身份</text><path d="M540.0,499 L540.0,640" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="484.0" y="551.5" width="112" height="25" fill="#f7f8fa"/><text x="540.0" y="569.5" text-anchor="middle" class="edge">root 不匹配</text><rect x="55" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="71" y="204" class="node">Facilitator</text><text x="71" y="230" class="caption">roomRoot = root-7</text><rect x="425" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="441" y="204" class="node">begin</text><text x="441" y="230" class="caption">session → pending root</text><text x="441" y="249" class="caption">dispatch</text><rect x="795" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="811" y="204" class="node">Pi Session</text><text x="811" y="230" class="caption">返回 sessionTurn = turn-9</text><rect x="795" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="811" y="439" class="node">事件先到</text><text x="811" y="465" class="caption">按 session + turn 暂存</text><rect x="425" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="441" y="439" class="node">accept</text><text x="441" y="465" class="caption">pending root 匹配才绑定</text><rect x="55" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="71" y="439" class="node">公共协作事件</text><text x="71" y="465" class="caption">带 root / dispatch 身份</text><rect x="425" y="640" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="441" y="674" class="node">不匹配的 ACK</text><text x="441" y="700" class="caption">返回空元组，不抢占新派发</text><text x="55" y="786" font-size="13" fill="#586375">PAW · 2026-09-05 源码教学图；不是实时运行或收益图</text></svg>