<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title desc"><title id="title">便宜的候选，先过质量门</title><desc id="desc">模型调用成本与质量分开判断，失败候选保留。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#77788c"/></marker></defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#202532}.node{font-size:18px;font-weight:600}.caption{font-size:13px;fill:#586375}.edge{font-size:14px;fill:#5143ae}</style><rect width="1080" height="810" fill="#f7f8fa"/><text x="55" y="65" font-size="30" font-weight="600">便宜的候选，先过质量门</text><text x="55" y="110" font-size="17">模型调用成本与质量分开判断，失败候选保留。</text><path d="M285,217.0 L425,217.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="327.0" y="199.0" width="56" height="25" fill="#f7f8fa"/><text x="355.0" y="217.0" text-anchor="middle" class="edge">相同任务</text><path d="M655,217.0 L795,217.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="676.0" y="199.0" width="98" height="25" fill="#f7f8fa"/><text x="725.0" y="217.0" text-anchor="middle" class="edge">质量不足时适配</text><path d="M910.0,264 L910.0,405" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="868.0" y="316.5" width="84" height="25" fill="#f7f8fa"/><text x="910.0" y="334.5" text-anchor="middle" class="edge">实际运行结果</text><path d="M795,452.0 L655,452.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="697.0" y="434.0" width="56" height="25" fill="#f7f8fa"/><text x="725.0" y="452.0" text-anchor="middle" class="edge">门禁通过</text><path d="M425,452.0 L285,452.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="327.0" y="434.0" width="56" height="25" fill="#f7f8fa"/><text x="355.0" y="452.0" text-anchor="middle" class="edge">比较估算</text><path d="M170.0,499 L170.0,640" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="142.0" y="551.5" width="56" height="25" fill="#f7f8fa"/><text x="170.0" y="569.5" text-anchor="middle" class="edge">不能跳过</text><rect x="55" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="71" y="204" class="node">基线</text><text x="71" y="230" class="caption">固定任务 / 配置 / 分母</text><rect x="425" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="441" y="204" class="node">仅换模型</text><text x="441" y="230" class="caption">隔离模型切换影响</text><rect x="795" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="811" y="204" class="node">再改 Prompt</text><text x="811" y="230" class="caption">固定低成本模型</text><rect x="795" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="811" y="439" class="node">质量与证据门</text><text x="811" y="465" class="caption">缺指标 = unknown；失败 = reject</text><rect x="425" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="441" y="439" class="node">成本比较</text><text x="441" y="465" class="caption">只在合格候选中选择</text><rect x="55" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="71" y="439" class="node">有范围的 Keep</text><text x="71" y="465" class="caption">单轮 Validation 结论</text><rect x="55" y="640" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="71" y="674" class="node">独立验证 / 应用验收</text><text x="71" y="700" class="caption">新的证据，可能再次拒绝</text><text x="55" y="786" font-size="13" fill="#586375">PAW · 2026-09-05 源码教学图；不是实时运行或收益图</text></svg>