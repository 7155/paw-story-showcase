<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title desc"><title id="title">存下、选中、送达，是三件事</title><desc id="desc">once 优先避免重复，代价是发送前崩溃可能遗漏。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#77788c"/></marker></defs><style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#202532}.node{font-size:18px;font-weight:600}.caption{font-size:13px;fill:#586375}.edge{font-size:14px;fill:#5143ae}</style><rect width="1080" height="810" fill="#f7f8fa"/><text x="55" y="65" font-size="30" font-weight="600">存下、选中、送达，是三件事</text><text x="55" y="110" font-size="17">once 优先避免重复，代价是发送前崩溃可能遗漏。</text><path d="M285,217.0 L425,217.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="327.0" y="199.0" width="56" height="25" fill="#f7f8fa"/><text x="355.0" y="217.0" text-anchor="middle" class="edge">候选记录</text><path d="M655,217.0 L795,217.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="669.0" y="199.0" width="112" height="25" fill="#f7f8fa"/><text x="725.0" y="217.0" text-anchor="middle" class="edge">选中 items</text><path d="M910.0,264 L910.0,405" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="833.0" y="316.5" width="154" height="25" fill="#f7f8fa"/><text x="910.0" y="334.5" text-anchor="middle" class="edge">Runtime RPC</text><path d="M795,452.0 L655,452.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="697.0" y="434.0" width="56" height="25" fill="#f7f8fa"/><text x="725.0" y="452.0" text-anchor="middle" class="edge">接受回执</text><path d="M425,452.0 L285,452.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="327.0" y="434.0" width="56" height="25" fill="#f7f8fa"/><text x="355.0" y="452.0" text-anchor="middle" class="edge">后续读取</text><path d="M910.0,264 L910.0,310 L725,310 L725,687.0 L795,687.0" stroke="#77788c" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="789.5" y="286" width="56" height="25" fill="#f7f8fa"/><text x="817.5" y="304" text-anchor="middle" class="edge">进程中断</text><rect x="55" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="71" y="204" class="node">上下文记录</text><text x="71" y="230" class="caption">pending + 生命周期 + 来源</text><rect x="425" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="441" y="204" class="node">materialize</text><text x="441" y="230" class="caption">到期过滤 / lane / 条数与预算</text><rect x="795" y="170" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="811" y="204" class="node">预留 deliveryId</text><text x="811" y="230" class="caption">once/turn → consumed</text><rect x="795" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="811" y="439" class="node">Pi Runtime</text><text x="811" y="465" class="caption">实际收到内容才可使用</text><rect x="425" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="441" y="439" class="node">mark_delivered</text><text x="441" y="465" class="caption">关联真实 turnId</text><rect x="55" y="405" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="71" y="439" class="node">再次读取</text><text x="71" y="465" class="caption">persistent 可保留；once 不重入</text><rect x="795" y="640" width="230" height="94" rx="12" fill="white" stroke="#b8bdcb"/><text x="811" y="674" class="node">预留后、送达前崩溃</text><text x="811" y="700" class="caption">可能遗漏；不伪称 exactly-once</text><text x="55" y="786" font-size="13" fill="#586375">PAW · 2026-09-05 源码教学图；不是实时运行或收益图</text></svg>